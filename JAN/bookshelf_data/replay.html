<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FCIT* · Bookshelf small</title>
<style>body{margin:0;background:#101923;color:#e6edf3;font:16px system-ui}header{padding:22px 28px}h1{font-size:24px;margin:0 0 8px}p{color:#a9bac9;margin:4px 0}canvas{display:block;width:100%;height:65vh;touch-action:none}footer{padding:16px 28px;display:flex;gap:18px;align-items:center}input{flex:1}button{background:#79dfc3;border:0;padding:12px 24px;border-radius:6px;font:inherit;cursor:pointer}</style>
<header><h1>FCIT* · Bookshelf small <span id="index"></span></h1><p>Original MotionBenchMaker scene · Panda collision-sphere model · unsmoothed initial solution</p><p>Drag to rotate. Scroll to zoom. Playback speed is illustrative, not a robot timing profile.</p></header>
<canvas id="canvas"></canvas><footer><button id="play">Pause</button><input aria-label="Path progress" id="progress" type="range" min="0" max="1000" value="0"><span id="label">0%</span></footer>
<script>
const data=__SCENE_DATA__;
const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d'),slider=document.getElementById('progress');
document.getElementById('index').textContent='· problem '+data.problem.index;
let yaw=-0.8,pitch=0.42,zoom=1,playing=true,phase=0,last=0,drag=null;
function project(v){let x=v[0]-.35,y=v[1]-.3,z=v[2]-.5,c=Math.cos(yaw),s=Math.sin(yaw),a=c*x-s*y,b=s*x+c*y;return [canvas.width/2+a*scale,canvas.height/2-(Math.cos(pitch)*z-Math.sin(pitch)*b)*scale,Math.cos(pitch)*b+Math.sin(pitch)*z]}
let scale=250;
function rotate(v,q){let [x,y,z,w]=q,t=[2*(y*v[2]-z*v[1]),2*(z*v[0]-x*v[2]),2*(x*v[1]-y*v[0])];return [v[0]+w*t[0]+y*t[2]-z*t[1],v[1]+w*t[1]+z*t[0]-x*t[2],v[2]+w*t[2]+x*t[1]-y*t[0]]}
function world(v,obj){return rotate(v,obj.orientation_quat_xyzw).map((a,i)=>a+obj.position[i])}
function line(a,b,color){a=project(a);b=project(b);ctx.strokeStyle=color;ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.stroke()}
function draw(){canvas.width=canvas.clientWidth*devicePixelRatio;canvas.height=canvas.clientHeight*devicePixelRatio;scale=Math.min(canvas.width,canvas.height)*.53*zoom;ctx.lineWidth=devicePixelRatio;
for(let i=-10;i<=15;i++){line([i/10,-1,0],[i/10,1.5,0],'#24313e');line([-1,i/10,0],[1.5,i/10,0],'#24313e')}
let faces=[];
for(const o of data.problem.box){let h=o.half_extents,v=[];for(let i=0;i<8;i++)v.push(world([h[0]*(i&1?1:-1),h[1]*(i&2?1:-1),h[2]*(i&4?1:-1)],o));for(const ids of [[0,1,3,2],[4,5,7,6],[0,1,5,4],[2,3,7,6],[0,2,6,4],[1,3,7,5]]){let p=ids.map(i=>project(v[i]));faces.push({kind:'face',p,z:p.reduce((a,b)=>a+b[2],0)/4})}}
for(const o of data.problem.cylinder){for(let j=0;j<10;j++){let p=project(world([0,0,(j/9-.5)*o.length],o));faces.push({kind:'sphere',p,r:o.radius*scale,z:p[2],color:'#f1b669'})}}
let frame=data.frames[Math.min(data.frames.length-1,Math.floor(phase*(data.frames.length-1)))];
for(const s of frame){let p=project(s);faces.push({kind:'sphere',p,r:s[3]*scale,z:p[2],color:'#78dfc6'})}
faces.sort((a,b)=>b.z-a.z);for(const f of faces){if(f.kind==='face'){ctx.beginPath();f.p.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();ctx.fillStyle='rgba(125,145,166,.25)';ctx.fill();ctx.strokeStyle='#9aafc3';ctx.stroke()}else{ctx.beginPath();ctx.arc(f.p[0],f.p[1],f.r,0,2*Math.PI);ctx.fillStyle=f.color;ctx.fill();ctx.strokeStyle='#254750';ctx.stroke()}}
slider.value=Math.round(phase*1000);document.getElementById('label').textContent=Math.round(phase*100)+'%'}
function tick(now){if(playing&&last)phase=(phase+(now-last)/8000)%1;last=now;draw();requestAnimationFrame(tick)}
document.getElementById('play').onclick=function(){playing=!playing;this.textContent=playing?'Pause':'Play'};
slider.oninput=()=>{phase=Number(slider.value)/1000;playing=false;document.getElementById('play').textContent='Play'};
canvas.onpointerdown=e=>{drag=[e.clientX,e.clientY];canvas.setPointerCapture(e.pointerId)};
canvas.onpointerup=()=>drag=null;canvas.onpointermove=e=>{if(drag){yaw+=(e.clientX-drag[0])*.008;pitch=Math.max(-1.3,Math.min(1.3,pitch+(e.clientY-drag[1])*.008));drag=[e.clientX,e.clientY]}};
canvas.onwheel=e=>{e.preventDefault();zoom=Math.max(.5,Math.min(3,zoom*Math.exp(-e.deltaY*.001)))};requestAnimationFrame(tick);
</script></html>
